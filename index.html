<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-soft: #f8fafc;
      --bg-card: #ffffff;
      --ink-main: #0f172a;
      --ink-muted: #64748b;
      --line: #e2e8f0;
      --accent: #0ea5e9;
      --accent-dark: #0284c7;
      --accent-soft: #f0f9ff;
      --ok: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

    body {
      background:
        radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.08), transparent 42%),
        radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.06), transparent 42%),
        var(--bg-page);
      color: var(--ink-main);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
    }

    .app-shell {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 50px -12px rgba(15, 23, 42, 0.09);
      align-self: flex-start;
    }

    /* رأس التطبيق */
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 10px 20px -6px rgba(2, 132, 199, 0.45);
    }
    .brand-title {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: var(--ink-main);
    }
    .brand-sub {
      font-size: 0.74rem;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-pill {
      background: var(--bg-soft);
      color: var(--ink-main);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .btn-pill:hover {
      background: var(--accent-soft);
      border-color: #bae6fd;
      color: var(--accent-dark);
    }

    /* البطاقات */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03);
    }
    .card-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--ink-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: var(--bg-soft);
      color: var(--ink-main);
      font-size: 0.92rem;
      transition: all 0.16s ease;
    }
    .field:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.14);
    }

    .btn-main {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 11px 16px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px -8px rgba(2, 132, 199, 0.55);
      transition: transform 0.12s ease, box-shadow 0.16s ease;
      white-space: nowrap;
    }
    .btn-main:hover { box-shadow: 0 12px 24px -8px rgba(2, 132, 199, 0.65); }
    .btn-main:active { transform: scale(0.98); }

    .btn-accept {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 7px 13px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-reject {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 7px 13px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-reject:hover { background: #fee2e2; }

    .status-msg {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent-dark);
      min-height: 18px;
    }

    /* بطاقة المستخدم النشط */
    .profile-banner {
      background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 100%);
      border: 1px solid #bae6fd;
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-avatar {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 900;
      flex-shrink: 0;
    }
    .profile-name { font-size: 1rem; font-weight: 800; color: var(--ink-main); }
    .profile-phone { font-size: 0.8rem; color: var(--ink-muted); direction: ltr; text-align: right; }

    /* القوائم وجهات الاتصال */
    .list-stack { display: flex; flex-direction: column; gap: 8px; }
    .req-row {
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 11px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .contact-card {
      text-decoration: none;
      color: inherit;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transition: all 0.16s ease;
    }
    .contact-card:hover {
      background: var(--accent-soft);
      border-color: #7dd3fc;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -10px rgba(2, 132, 199, 0.25);
    }
    .contact-left { display: flex; align-items: center; gap: 11px; }
    .mini-avatar {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: #e0f2fe;
      color: #0369a1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .chat-chip {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .muted-empty { font-size: 0.82rem; color: var(--ink-muted); padding: 4px 2px; }

    /* فقاعة التنبيه العائمة */
    .floating-bubble {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 420px);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      color: var(--ink-main);
      border: 1.5px solid #38bdf8;
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16);
      z-index: 99;
      flex-direction: column;
      gap: 10px;
    }
    .floating-bubble.show { display: flex; }
    .bubble-actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="floating-bubble" id="floatingBubble">
    <div id="bubbleText" style="font-weight:700;font-size:0.9rem;line-height:1.45;"></div>
    <div class="bubble-actions" id="bubbleActions"></div>
  </div>

  <div class="app-shell">
    <header class="brand-header">
      <div class="brand-wrap">
        <div class="brand-logo">C</div>
        <div>
          <div class="brand-title">App Chat</div>
          <div class="brand-sub">تواصل سريع وأنيق</div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-pill" onclick="requestSystemNotifications()">🔔 الإشعارات</button>
        <button type="button" class="btn-pill" id="logoutBtn" style="display:none;" onclick="logoutUser()">خروج</button>
      </div>
    </header>

    <section class="card" id="authCard">
      <div class="card-title">تسجيل الدخول أو إنشاء حساب</div>
      <input type="tel" id="phoneInput" class="field" placeholder="رقم الموبايل (مثال: 07700000000)">
      <input type="text" id="usernameInput" class="field" maxlength="24" placeholder="اسم المستخدم">
      <input type="password" id="passwordInput" class="field" placeholder="كلمة السر">
      <button type="button" class="btn-main" onclick="loginOrRegister()">دخول / حفظ الحساب</button>
      <div class="status-msg" id="authStatus"></div>
    </section>

    <section id="mainDashboard" style="display:none;flex-direction:column;gap:14px;">
      <div class="profile-banner">
        <div class="profile-avatar" id="myAvatar">U</div>
        <div>
          <div class="profile-name" id="activeUserLabel"></div>
          <div class="profile-phone" id="activePhoneLabel"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">إضافة جهة اتصال</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input type="text" id="targetContactInput" class="field" style="flex:1;min-width:170px;" placeholder="رقم الموبايل أو اسم المستخدم">
          <button type="button" class="btn-main" onclick="sendContactRequest()">إرسال طلب</button>
        </div>
        <div class="status-msg" id="contactStatus"></div>
      </div>

      <div class="card">
        <div class="card-title">طلبات الاتصال الواردة</div>
        <div class="list-stack" id="incomingRequestsBox">
          <div class="muted-empty">لا توجد طلبات حالياً.</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">جهات الاتصال</div>
        <div class="list-stack" id="acceptedContactsBox">
          <div class="muted-empty">لا توجد جهات اتصال بعد.</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = 'https://lzvtnfdgynwczrkwlwhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI';
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let currentUser = JSON.parse(localStorage.getItem('appchat_session') || 'null');
    let realtimeChannel = null;

    async function hashPassword(pw) {
      const data = new TextEncoder().encode(pw);
      const buf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function requestSystemNotifications() {
      if (!('Notification' in window)) return alert('المتصفح لا يدعم إشعارات النظام.');
      const perm = await Notification.requestPermission();
      alert(perm === 'granted' ? 'تم تفعيل الإشعارات بنجاح ✅' : 'لم يتم منح صلاحية الإشعارات.');
    }

    function showBubbleAlert(message, requestObj = null) {
      const bubble = document.getElementById('floatingBubble');
      const textEl = document.getElementById('bubbleText');
      const actionsEl = document.getElementById('bubbleActions');
      textEl.textContent = message;
      actionsEl.innerHTML = '';

      if (requestObj) {
        const acceptBtn = document.createElement('button');
        acceptBtn.className = 'btn-accept';
        acceptBtn.textContent = 'قبول';
        acceptBtn.onclick = () => { respondToRequest(requestObj, 'accepted'); hideBubbleAlert(); };

        const rejectBtn = document.createElement('button');
        rejectBtn.className = 'btn-reject';
        rejectBtn.textContent = 'رفض';
        rejectBtn.onclick = () => { respondToRequest(requestObj, 'rejected'); hideBubbleAlert(); };

        actionsEl.append(acceptBtn, rejectBtn);
      } else {
        const closeBtn = document.createElement('button');
        closeBtn.className = 'btn-pill';
        closeBtn.textContent = 'حسناً';
        closeBtn.onclick = hideBubbleAlert;
        actionsEl.appendChild(closeBtn);
      }

      bubble.classList.add('show');

      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        new Notification('App Chat', { body: message });
      }
    }

    function hideBubbleAlert() {
      document.getElementById('floatingBubble').classList.remove('show');
    }

    async function loginOrRegister() {
      const phone = document.getElementById('phoneInput').value.trim();
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const statusEl = document.getElementById('authStatus');

      if (!sb) {
        statusEl.textContent = 'تعذر الاتصال بقاعدة البيانات.';
        return;
      }
      if (!phone || !username || !password) {
        statusEl.textContent = 'يرجى إدخال رقم الموبايل واسم المستخدم وكلمة السر.';
        return;
      }

      statusEl.textContent = 'جارٍ التحقق وحفظ الحساب...';
      const pwHash = await hashPassword(password);

      const { data: existing, error: fetchErr } = await sb
        .from('app_chat_users')
        .select('*')
        .eq('phone', phone)
        .maybeSingle();

      if (fetchErr) {
        statusEl.textContent = 'خطأ في قاعدة البيانات: ' + fetchErr.message;
        return;
      }

      if (existing) {
        if (existing.password_hash !== pwHash) {
          statusEl.textContent = 'كلمة السر غير صحيحة لهذا الرقم.';
          return;
        }
        await sb.from('app_chat_users').update({ username }).eq('phone', phone);
      } else {
        const { error: insertErr } = await sb
          .from('app_chat_users')
          .insert({ phone, username, password_hash: pwHash });
        if (insertErr) {
          statusEl.textContent = 'تعذر حفظ الحساب: ' + insertErr.message;
          return;
        }
      }

      currentUser = { phone, username };
      localStorage.setItem('appchat_session', JSON.stringify(currentUser));
      statusEl.textContent = '';
      renderSession();
      setupRealtime();
      loadRequestsAndContacts();
    }

    function logoutUser() {
      currentUser = null;
      localStorage.removeItem('appchat_session');
      if (realtimeChannel && sb) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
      document.getElementById('mainDashboard').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('authCard').style.display = 'flex';
    }

    function renderSession() {
      if (!currentUser) return;
      document.getElementById('authCard').style.display = 'none';
      document.getElementById('mainDashboard').style.display = 'flex';
      document.getElementById('logoutBtn').style.display = 'inline-block';
      document.getElementById('activeUserLabel').textContent = currentUser.username;
      document.getElementById('activePhoneLabel').textContent = currentUser.phone;
      document.getElementById('myAvatar').textContent = currentUser.username.trim().charAt(0).toUpperCase() || 'U';
    }

    async function sendContactRequest() {
      if (!currentUser || !sb) return;
      const target = document.getElementById('targetContactInput').value.trim();
      const statusEl = document.getElementById('contactStatus');
      if (!target) return;

      let targetPhone = target;
      if (!/^\+?\d{6,}$/.test(target)) {
        const { data: u } = await sb.from('app_chat_users').select('phone').eq('username', target).maybeSingle();
        if (!u) {
          statusEl.textContent = 'لم يتم العثور على مستخدم بهذا الاسم.';
          return;
        }
        targetPhone = u.phone;
      }

      if (targetPhone === currentUser.phone) {
        statusEl.textContent = 'لا يمكنك إضافة رقمك نفسه.';
        return;
      }

      const { data: inserted, error } = await sb
        .from('app_chat_requests')
        .insert({
          from_phone: currentUser.phone,
          from_name: currentUser.username,
          to_phone: targetPhone,
          status: 'pending'
        })
        .select()
        .single();

      if (error) {
        statusEl.textContent = 'تعذر إرسال الطلب: ' + error.message;
        return;
      }

      await realtimeChannel?.send({
        type: 'broadcast',
        event: 'contact_request',
        payload: inserted
      });

      document.getElementById('targetContactInput').value = '';
      statusEl.textContent = 'تم إرسال طلب الاتصال بنجاح ✅';
      loadRequestsAndContacts();
    }

    async function respondToRequest(reqObj, decision) {
      if (!sb || !reqObj?.id) return;
      await sb.from('app_chat_requests').update({ status: decision }).eq('id', reqObj.id);
      loadRequestsAndContacts();
    }

    async function loadRequestsAndContacts() {
      if (!currentUser || !sb) return;

      const { data: rows } = await sb
        .from('app_chat_requests')
        .select('*')
        .or(`from_phone.eq.${currentUser.phone},to_phone.eq.${currentUser.phone}`);

      const list = rows || [];
      const incoming = list.filter(r => r.to_phone === currentUser.phone && r.status === 'pending');
      const accepted = list.filter(r => r.status === 'accepted');

      const reqBox = document.getElementById('incomingRequestsBox');
      if (incoming.length === 0) {
        reqBox.innerHTML = '<div class="muted-empty">لا توجد طلبات حالياً.</div>';
      } else {
        reqBox.innerHTML = '';
        incoming.forEach(r => {
          const div = document.createElement('div');
          div.className = 'req-row';
          div.innerHTML = `<div><div style="font-weight:800;">${r.from_name}</div><div class="profile-phone">${r.from_phone}</div></div>`;
          const btns = document.createElement('div');
          btns.style.display = 'flex';
          btns.style.gap = '6px';

          const acc = document.createElement('button');
          acc.className = 'btn-accept';
          acc.textContent = 'قبول';
          acc.onclick = () => respondToRequest(r, 'accepted');

          const rej = document.createElement('button');
          rej.className = 'btn-reject';
          rej.textContent = 'رفض';
          rej.onclick = () => respondToRequest(r, 'rejected');

          btns.append(acc, rej);
          div.appendChild(btns);
          reqBox.appendChild(div);
        });
      }

      const accBox = document.getElementById('acceptedContactsBox');
      if (accepted.length === 0) {
        accBox.innerHTML = '<div class="muted-empty">لا توجد جهات اتصال بعد.</div>';
      } else {
        accBox.innerHTML = accepted.map(r => {
          const isSender = r.from_phone === currentUser.phone;
          const otherPhone = isSender ? r.to_phone : r.from_phone;
          const otherName = isSender ? otherPhone : r.from_name;
          const initial = otherName.trim().charAt(0).toUpperCase() || '💬';
          const url = `chat.html?peer=${encodeURIComponent(otherPhone)}&name=${encodeURIComponent(otherName)}`;
          return `<a href="${url}" class="contact-card">
            <div class="contact-left">
              <div class="mini-avatar">${initial}</div>
              <div>
                <div style="font-weight:800;">${otherName}</div>
                <div class="profile-phone">${otherPhone}</div>
              </div>
            </div>
            <span class="chat-chip">دردشة ←</span>
          </a>`;
        }).join('');
      }
    }

    function setupRealtime() {
      if (!sb || !currentUser || realtimeChannel) return;
      realtimeChannel = sb.channel('app_chat_contacts_v1')
        .on('broadcast', { event: 'contact_request' }, ({ payload }) => {
          if (payload && payload.to_phone === currentUser.phone) {
            showBubbleAlert(`طلب اتصال جديد من ${payload.from_name} (${payload.from_phone})`, payload);
            loadRequestsAndContacts();
          }
        })
        .subscribe();
    }

    if (currentUser) {
      renderSession();
      setupRealtime();
      loadRequestsAndContacts();
    }
  </script>
</body>
</html>
